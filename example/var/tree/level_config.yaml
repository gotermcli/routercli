# This YAML file contains the commands for the "configure terminal" Command
# Level.

commands:
  hostname:
    desc_key: hostname.desc
    arghelp_key: hostname.arghelp
    minargs: 1
    maxargs: 1
    maxarglength: 64
    # "no hostname" resets to the default name. See cmd/product/cmd_hostname.go.
    negatable: true
    run: hostname

  interface:
    desc_key: interface.desc
    arghelp_key: interface.arghelp
    minargs: 1
    maxargs: 1
    maxarglength: 32
    # Pushes config-if mode (see cmd/product/cmd_interface.go), scoped to
    # whichever interface name was given.
    run: interface

  line:
    desc_key: line.desc
    # Pushes config-line mode (see cmd/product/cmd_line.go), item 11 of
    # the Framework Gap Roadmap, the persistent, deployment wide
    # default for terminal length, width, and paging.
    run: line

  banner:
    desc_key: banner.desc
    subcommands:
      motd:
        desc_key: banner.motd.desc
        minargs: 1
        maxargs: 1
        maxarglength: 256
        arghelp_key: banner.motd.arghelp
        # "no banner motd" clears it. See cmd/product/cmd_banner.go.
        negatable: true
        run: banner.motd
      login:
        desc_key: banner.login.desc
        minargs: 1
        maxargs: 1
        maxarglength: 256
        arghelp_key: banner.login.arghelp
        # "no banner login" clears it. See cmd/product/cmd_banner.go.
        negatable: true
        run: banner.login

  password:
    desc_key: password.desc
    subcommands:
      manager:
        desc_key: password.manager.desc
        # "password manager" prompts for the new secret, masked, not
        # typed as a same-line argument. See cmd_password_manager.go
        # for why. "no password manager" clears it, also with no
        # argument needed.
        negatable: true
        run: password-manager
        subcommands:
          hash:
            desc_key: password.manager.hash.desc
            arghelp_key: password.manager.hash.arghelp
            minargs: 1
            maxargs: 1
            # Takes an already-hashed value directly, never a
            # plaintext password, see cmd_password_manager.go's own
            # doc comment on "password manager hash" for the whole
            # reasoning, restoring a Command Level's secret from
            # saved configuration text rather than a live prompt.
            run: password-manager.hash

  terminal:
    desc_key: terminal.desc
    subcommands:
      length:
        desc_key: terminal.length.desc
        minargs: 1
        maxargs: 1
        arghelp_key: terminal.length.arghelp
        run: terminal.length
      width:
        desc_key: terminal.width.desc
        minargs: 1
        maxargs: 1
        arghelp_key: terminal.width.arghelp
        run: terminal.width
      filter-mode:
        desc_key: terminal.filter_mode.desc
        minargs: 1
        maxargs: 1
        arghelp_key: terminal.filter_mode.arghelp
        run: terminal.filter-mode
      history:
        desc_key: terminal.history.desc
        subcommands:
          size:
            desc_key: terminal.history.size.desc
            minargs: 1
            maxargs: 1
            arghelp_key: terminal.history.size.arghelp
            run: terminal.history.size
