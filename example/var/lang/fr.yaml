# French language catalog for RouterCLI.
#
# Deliberately left incomplete. A few keys near the bottom are commented
# out, on purpose, to demonstrate and exercise the fallback chain
# described in i18n.go: a missing key here falls back to the English
# catalog, DefaultLanguage, rather than a blank, silent gap. Try
# "show interface" after "language set fr" to see English text with
# nothing broken.

