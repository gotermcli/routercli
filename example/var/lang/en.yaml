line.width.desc: "Set the deployment's own default terminal width, used only when a session has never typed 'terminal width' itself and its real terminal width cannot be detected"
line.width.arghelp: "<0-512>  Enter a number for the 'width' command/parameter."
line.paging.desc: "Set (or, with 'no', clear) whether the interactive pager runs at all for this deployment"
help.desc: "Display available commands, or, with a command name typed after it, a detailed description of that one command"
help.arghelp: "[<word...>]  A command name to show a detailed description of, including its own arguments and subcommands. With nothing typed, this lists every command available at the current Command Level."
exit.desc: "Exit this mode (or the CLI, if already at the top level)"
end.desc: "Return to the top level from any mode"

