# English (default) language catalog for RouterCLI.

# --- Command descriptions (var/tree/level_*.yaml desc_key values) ---
configure.desc: "Enter configuration mode"
configure.help: "Configuration mode is where a session changes this device's own persistent settings, hostname, interfaces, banners, passwords, and the deployment wide terminal and line defaults among them. Every change made here applies to the running session immediately, the same as anywhere else in RouterCLI, and reaches disk only once 'write memory' saves it. 'configure terminal' is the one way in; 'end' or 'exit' leaves it, back to exec."
configure.terminal.desc: "Configure from the terminal"
set.desc: "Set a configuration value"
set.description.desc: "Set the description for this example session"
set.description.arghelp: "<text>  The description for this session. Quote it if it contains spaces."
show.desc: "Show running system information"
show.aliases.desc: "Display every runtime defined command alias"
show.history.desc: "Display the commands typed so far this session"
show.interface.desc: "Display interface information"
show.running_config.desc: "Display the current configuration"
show.startup_config.desc: "Display the saved startup configuration"
show.terminal.desc: "Display the current terminal settings"
show.users.desc: "Display every session currently attached to the daemon"
show.version.desc: "Display version information"
erase.desc: "Erase saved configuration"
erase.startup_config.desc: "Erase the saved startup-config"
erase.users.desc: "Replace the user database with the factory default account set"
restore_factory_defaults.desc: "Erase startup-config and restore users.yaml and roles.yaml to their factory defaults, then reload"
reboot.desc: "Re-read users.yaml, roles.yaml, and startup-config from disk, then end this connection, right away or after a delay"
reboot.help: "With no argument, this re-reads the user database, the roles file, and startup-config from disk, rebuilds this session's own state from them, and ends the connection right away; reconnecting comes back exactly as startup-config left it. With a delay in seconds, this instead schedules that same reboot to happen on its own, unattended, and returns immediately, leaving the session free to keep working. 'no reboot' or 'no reload' cancels a pending delayed reboot before it fires.\n\nThis is what makes it safe to test a risky change, a role grant or a new account among them. Save a known good configuration with 'write memory', schedule a reboot a few minutes out, make the change, then log out and back in to confirm it still works. If it does not, waiting out the delay restores the last saved configuration automatically; if it does, 'no reboot' cancels the pending reboot before it ever fires."
reboot.arghelp: "[<seconds>]  Optional delay before this runs. With no delay, this runs right away. 'no reboot' or 'no reload' cancels a pending delayed reboot."
reload.desc: "An alias for 'reboot'"
disconnect.desc: "Disconnect an attached session"
disconnect.user.desc: "End a session belonging to a user, attached to the daemon"
disconnect.user.arghelp: "<username> [<session-id>]  A bare username ends that user's own one session when exactly one is attached, and is refused, listing the candidates, when more than one is. A session ID, the same short identifier 'show users' prints per row, names one exactly."
write.desc: "Save configuration and account changes"
write.memory.desc: "Save running-config to startup-config and every in-memory user account change to disk"
admin.desc: "Enter admin, a dedicated level for account management and full configuration access"
return_admin.desc: "Leave admin, back to exec"
account.desc: "Manage user accounts"
account.create.desc: "Create a new user account"
account.create.arghelp: "<username> [generate | hash <hash>]  A new username alone prompts for its password; 'generate' auto-generates one meeting this deployment's password policy; 'hash <hash>' imports an already-computed hash directly."
account.delete.desc: "Delete a user account"
account.delete.arghelp: "<username>  The account to delete."
account.roles.desc: "Manage the roles assigned to a user account"
account.roles.add.desc: "Add a role to a user account"
account.roles.add.arghelp: "<username> <role>  The account and the role to add to it."
account.roles.remove.desc: "Remove a role from a user account"
account.roles.remove.arghelp: "<username> <role>  The account and the role to remove from it."
enable.desc: "Elevate this session to run privileged commands"
disable.desc: "Return this session to unprivileged access"
audit_log.desc: "Control the audit log"
audit_log.enable.desc: "Turn audit logging on"
audit_log.disable.desc: "Turn audit logging off"
audit_log.status.desc: "Show whether audit logging is on"
language.desc: "Manage the active display language"
language.list.desc: "List available languages"
language.set.desc: "Switch the active language"
language.set.arghelp: "<code>  The language code to switch to, for example en. See 'language list' for what is available."
password.desc: "Manage passwords for this device"
password.manager.desc: "Set (or, with 'no', clear) the secret required to elevate this session"
password.manager.hash.desc: "Set the secret required to elevate this session directly from an already-hashed value, such as one recorded in a saved configuration"
password.manager.hash.arghelp: "<hash>  An already-hashed secret, in this project's own \"$id$encoded\" storage form, not a plaintext password."
terminal.desc: "Configure terminal display settings"
terminal.length.desc: "Set the height of the terminal window"
terminal.width.desc: "Set the width of the terminal window"
terminal.filter_mode.desc: "Set how '| include', '| exclude', and '| begin' match their pattern"
terminal.history.desc: "Configure command history"
terminal.history.size.desc: "Set how many commands 'show history' shows"
diagnostic_mode.desc: "Enter diagnostic mode (a third example privilege tier)"
self_test.desc: "Run a self-test"
exit_diagnostic_mode.desc: "Leave diagnostic mode, back to exec"
user.desc: "Manage this account (password and multi-factor authentication)"
