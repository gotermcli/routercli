totp.enable.desc: "Enroll this account in TOTP-based two-factor authentication"
totp.enable.qr.desc: "Enroll this account in TOTP-based two-factor authentication, showing a QR code as well as the secret"
totp.disable.desc: "Remove TOTP-based two-factor authentication from this account"
user.password.desc: "Manage this account's password"
password.change.desc: "Change this account's password"
terminal.length.arghelp: "<0-512>  Enter a number for the 'length' command/parameter, or 0 to disable paging."
terminal.width.arghelp: "<0-512>  Enter a number for the 'width' command/parameter."
terminal.filter_mode.arghelp: "<substring|regex>  Enter 'substring' or 'regex' for the 'filter-mode' command/parameter."
terminal.history.size.arghelp: "<0-1000>  Enter a number for the 'size' command/parameter, or 0 to remember nothing further."

# --- Config mode ---
alias.desc: "Set a runtime defined short name for a command, scoped to the current Command Level"
alias.help: "An alias is a runtime defined short name for one command, scoped to whichever Command Level it was defined from. Typing the short name from that same Command Level runs the real command it stands for, with any further words typed after it appended onto the end, so 'alias sh show' lets 'sh interface' run 'show interface'. An alias applies to the running session immediately and is included in 'show running-config' right away, but it only survives a restart once 'write memory' saves it.\n\nRedefining a name that already answers to a real command, or to another already defined alias, is refused. Remove an existing alias first with 'no alias <alias>', then define it again; this is a deliberate security measure, so a change to an already trusted alias can never happen silently in one step. 'show aliases' lists every alias currently defined, grouped by Command Level."
alias.arghelp: "<alias> <word...>  The short name to type from this Command Level from now on, and the real command it expands to."
line.desc: "Configure this deployment's own persistent terminal length, width, and paging defaults"
hostname.desc: "Set the system hostname"
hostname.arghelp: "<name>  The new hostname for this device, up to 64 characters."
interface.desc: "Configure an interface"
interface.arghelp: "<name>  The interface name to configure, for example eth0."
banner.desc: "Configure a banner shown before login"
banner.motd.desc: "Set the message of the day banner, shown to every connection"
banner.login.desc: "Set the login banner, shown immediately before the username prompt"
banner.motd.arghelp: "<text>  The banner text. Quote it if it contains spaces."
banner.login.arghelp: "<text>  The banner text. Quote it if it contains spaces."

